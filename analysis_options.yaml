include: package:flutter_lints/flutter.yaml
analyzer:
  exclude:
    - build/**
    # Generated by drift_dev; regenerate instead of editing.
    - test/drift/*/generated/**
    - '**/*.g.dart'
    - macos/**
    # Local agent worktrees (gitignored).
    - .claude/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
linter:
  rules:
    avoid_print: true
    use_build_context_synchronously: true
formatter:
  page_width: 100
