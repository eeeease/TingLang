name: tinglang_native_macos
description: macOS implementation of Tinglang's native backends (Swift, Swift Package Manager, Pigeon).
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.7'
dependencies:
  flutter:
    sdk: flutter
  path: 1.9.1
  tinglang_platform_interface: any
  sqlite3: 3.7.1
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.0
flutter:
  plugin:
    implements: tinglang_native
    platforms:
      macos:
        pluginClass: TinglangNativeMacosPlugin
        dartPluginClass: TinglangNativeMacos
